# Minecraft 26.2 (agent/client modules) requires the Gradle JVM itself to be
# Java 25, not merely the compile toolchain. That requirement lives in
# gradle/gradle-daemon-jvm.properties, which Gradle reads *before* it starts the
# daemon and which auto-provisions the JDK per platform.
#
# It used to be an `org.gradle.java.home` pointing at an absolute path under
# this machine's ~/.gradle/jdks — which meant the build only worked here, and
# had to be edited out by hand anywhere else (CI included). Regenerate the
# criteria file with: ./gradlew updateDaemonJvm --jvm-version=25
org.gradle.jvmargs=-Xmx4G
