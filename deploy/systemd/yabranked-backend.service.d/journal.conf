[Service]
# Cap what this unit may hold in the journal.
#
# A backend that cannot reach its replay storage logs one AWS SDK stack trace
# per failed call, and an SDK trace is about ninety lines. A MinIO that went
# away while its endpoint stayed configured produced 5816 of them in ten
# minutes — roughly 559 000 lines — which pushed every earlier entry out of the
# journal. The logging of that fault destroyed the evidence for every match
# played that day, which is a far more expensive outcome than the fault itself.
#
# The code side of this is fixed (S3ReplayBlobStore logs one line and keeps the
# trace at DEBUG), but the general shape — a tight loop against a dependency
# that is down — is not something to rely on never happening again. This bounds
# the blast radius whatever the cause, and it bounds it per unit, so a noisy
# backend can no longer evict the kernel's or docker's log along with its own.
LogRateLimitIntervalSec=30s
LogRateLimitBurst=2000
