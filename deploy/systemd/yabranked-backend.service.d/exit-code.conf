[Service]
# A JVM that exits on SIGTERM returns 143 (128+15), which is what every clean
# `systemctl restart` produces. Without this systemd calls each one
# "Failed with result exit-code", so the journal shows a failure line directly
# above a successful start and a real crash looks like all the others.
# Restart=on-failure also stops treating an intentional stop as a reason to
# restart, which is the behaviour that was always meant.
SuccessExitStatus=143
